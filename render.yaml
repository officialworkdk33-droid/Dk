services:
  - type: web
    name: customs-invoice-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: BRIDGE_URL
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      - key: MAX_FILE_MB
        value: "20"
